<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors ligne — EduManager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1e3a8a, #4f46e5); color: #fff;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px;
        }
        .card { text-align: center; max-width: 420px; }
        .badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 96px; height: 96px; border-radius: 28px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            font-size: 40px; font-weight: 900; letter-spacing: -1px;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }
        h1 { font-size: 26px; margin: 24px 0 8px; }
        p { color: rgba(255,255,255,.75); font-size: 15px; line-height: 1.6; }
        a {
            display: inline-block; margin-top: 28px; padding: 14px 28px; border-radius: 14px;
            background: #fff; color: #1e3a8a; font-weight: 700; font-size: 15px;
            text-decoration: none; transition: transform .15s ease, box-shadow .15s ease;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.3); }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">ED</div>
        <h1>Vous êtes hors ligne</h1>
        <p>Aucune connexion réseau détectée. Vérifiez votre Wi-Fi ou votre connexion de données puis réessayez.</p>
        <a href="/" onclick="event.preventDefault(); location.reload();">Recharger</a>
    </div>
</body>
</html>
